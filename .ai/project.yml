# way-of-working plugin contract for this repo.
# Full key reference: reference/project-schema.md in glunk-works/claude-workbench at the pinned tag.
# Live settings in this file were read back from GitHub: `repo` and the `main-required-checks`
# blocks on 2026-11-06, after the transfer to glunk-works, the `main-code-owner-approval` block and
# the other check pins on 2026-11-07, and the identities ids, from `GET users/<slug>[bot]` and
# `GET users/<login>`, on 2026-11-08. `architect-review`'s read-back is dated in the paragraph below.
# The `verify / verify` pin was read back from ruleset 26540407 on 2026-11-09.
# The `main-required-checks` blocks mirror a live read-back of
# `GET /repos/glunk-works/resume-orchestrator/rules/branches/main`, the approval ruleset mirrors its
# read-back by id, and the check names are the names GitHub reports for the required checks.
# `review.ci_gate.header` and `review.ci_gate.attestation` are copied from the plugin schema, as the
# review gate's own comment block says: pasted, never retyped. Every other value is a decision
# recorded in this repo, not a read-back.
#
# `architect-review` and its pin were mirrored here by PR 1 of #88 ahead of GitHub requiring them.
# The check was in `main-required-checks` by 2026-11-09, when a read of ruleset 26540407 showed it
# pinned to 15368. That mirror-first order was the one reference/cutover.md gives for a repo whose
# ruleset did not yet require the check.

# ── identity ─────────────────────────────────────────────────────────────────
repo: glunk-works/resume-orchestrator
pr_base: main
migration_base: null   # no long-lived integration branch; every PR lands on main.

# ── the deep record ──────────────────────────────────────────────────────────
roadmap: docs/proposals/pipeline-plan.md   # the plan: design, phases, sprints. GitHub holds status.
sprints_dir: sprints                       # declared but unused: planning.kind is github_milestones.
threat_model: docs/proposals/pipeline-plan.md   # §3.7 trust boundaries, §3.8 writes and credentials, §5 risks.

planning:
  kind: github_milestones   # one sprint = one milestone (S01–S10). Its issues are the task list.

decisions:
  log: docs/decisions.md
  prefix: RO-D

backlog:
  kind: github_issues
  repo: null              # this repo. It is PUBLIC: no issue may carry personal data (CLAUDE.md rule 4).
  path: null
  item_prefix: null

load_bearing_docs:
  - CLAUDE.md
  - readme.md
  - docs/decisions.md
  - docs/proposals/pipeline-plan.md
  - .ai/next-steps.md

# ── what counts as a behavior change ─────────────────────────────────────────
code_paths:
  - src/
  - tests/
  - .claude/
  - .devcontainer/          # the container definition is a trust boundary, so a change to it gets the review gate
  - CLAUDE.md               # the agent instructions change agent behaviour as much as .claude/ does
  - .github/
  - .ai/project.yml         # the gate reads the default branch's copy; an edit to it needs a review
  - pyproject.toml
  - uv.lock
  - .python-version
  - .gitignore              # the main guard against personal data being committed
  - .pre-commit-config.yaml
  - betterleaks.toml        # absent on purpose: the org scan reads it, and the ignore file below, from the
  - .betterleaksignore      # PR's base commit, so a change that silences it needs a critic's look
  - .gitattributes          # holds the repo-wide LF rule and the dev-container LF rule; it can still hide files from a scan, so a change needs a critic's look
  - tune_template.py        # stays until D5 removes it

# ── the local green gate ─────────────────────────────────────────────────────
# A local pre-check; CI on the PR is the gate of record.
gates:
  green:
    - { run: uv run pytest }
    - { run: uv run ruff check . }
    - { run: uv run ruff format --check . }

# ── branch protection ────────────────────────────────────────────────────────
# `main-required-checks` (ruleset id 26540407), `enforcement: active`, no bypass actors (read from
# `GET /repos/glunk-works/resume-orchestrator/rulesets/26540407`), targeting the default branch.
# `check_integrations` pins each check to 15368 (GitHub Actions). `main-code-owner-approval` holds the
# code owner's approval (ruleset id 26770416, read back by id on 2026-11-07).
# A new check goes to GitHub first and is mirrored here second.
ruleset:
  name: main-required-checks
  rule_types: [deletion, non_fast_forward, pull_request, required_status_checks]
  required_checks:
    - lint
    - test
    - dependency-audit
    - sbom
    - zizmor
    - pr-title
    - secrets / scan
    - architect-review
    - verify / verify
  check_integrations:
    lint: 15368
    test: 15368
    dependency-audit: 15368
    sbom: 15368
    zizmor: 15368
    pr-title: 15368
    "secrets / scan": 15368
    architect-review: 15368
    "verify / verify": 15368
rulesets:
  - name: main-required-checks
    source: repo
    rule_types: [deletion, non_fast_forward, pull_request, required_status_checks]
    required_checks:
      - lint
      - test
      - dependency-audit
      - sbom
      - zizmor
      - pr-title
      - secrets / scan
      - architect-review
      - verify / verify
    check_integrations:
      lint: 15368
      test: 15368
      dependency-audit: 15368
      sbom: 15368
      zizmor: 15368
      pr-title: 15368
      "secrets / scan": 15368
      architect-review: 15368
      "verify / verify": 15368
  - name: main-code-owner-approval
    source: repo
    rule_types: [deletion, non_fast_forward, pull_request]

# ── the fresh-session review gate ────────────────────────────────────────────
# A PR that touches code_paths reads red on `architect-review` until the reviewer App posts a
# fresh-session review that passes on its current head. The two strings are matched byte for byte
# by the gate workflow: paste them, never retype them. /way-of-working:critic-gate stays the
# pre-PR critic pass; the gate is the review of record.
review:
  ci_gate:
    check: architect-review
    header: "**Opus/Architect review (automated)**"
    attestation: "*Fresh-session review: this session did not author the diff.*"
    triggers_on: null   # null means code_paths

# ── agents ───────────────────────────────────────────────────────────────────
agents:
  enabled: [architect, coder, security-critic, docs-consistency]
  # Rule-selected, no pick-list: architect and security-critic for code_paths and for the extra
  # prefixes below (tracked paths that can carry rule-4 content, and the agent instructions);
  # docs-consistency for .md files and load_bearing_docs. The cursor ledger .ai/next-steps.md is
  # left out on purpose and gets docs-consistency only (CLAUDE.md, critic table). A new tracked
  # path under .ai/ must be added below, or it gets no architect or security-critic. This rule
  # stays after the review CI gate (#88): it selects the critics for the pre-PR pass, and it covers
  # docs/ and other paths outside code_paths. CLAUDE.md is in code_paths as well as here.
  diff_rule: [docs/, .ai/parked/, .ai/context/, CLAUDE.md, CHANGELOG.md, readme.md, example_, dummy_gemini_output.json]
models:
  architect: opus
  coder: sonnet
  second_opinion: null   # no different-model round offered by default.

# ── the sprint-orchestrator loop ─────────────────────────────────────────────
orchestration: null   # the loop never dispatches into this repo. The driver and lanes are not the org's loop orchestrator, so adopting them adds no `orchestration` block.

# ── declared identities ──────────────────────────────────────────────────────
# Trust is by numeric id. Each App's id is the bot account's user id from `GET users/<slug>[bot]`,
# not the App id. The maintainer is the only code owner and approves; an App or Dependabot opens
# every PR (RO-D21). A `[bot]` login is double-quoted: unquoted, the brackets are flow indicators.
identities:
  maintainer:
    - { login: Seuss27, id: 22668449 }
  dev_app: { login: "glunk-dev[bot]", id: 339840170, commit_route: api }
  reviewer_app: { login: "glunk-review[bot]", id: 339841158 }
  loop_app: { login: "glunk-loop[bot]", id: 338193635 }

# ── coder lanes ──────────────────────────────────────────────────────────────
# The dev container mounts `/tmp` as a named volume keyed by the checkout folder name
# (`.devcontainer/devcontainer.json`), so lane worktrees survive a container restart. The layout
# contract is in the plugin's `reference/project-schema.md`, section `lanes`.
lanes:
  dir: /tmp/lanes

# ── append-only files ────────────────────────────────────────────────────────
# A task spec here only adds one bullet to `CHANGELOG.md`, as the first bullet under
# `## Unreleased`. The release PR is the exception: see `CLAUDE.md`, *Deviations and known gaps*.
append_only:
  - CHANGELOG.md
